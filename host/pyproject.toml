[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tpu-host"
version = "0.1.0"
description = "Host side of the TPU: instruction encoding, reference model, compiler, device links"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyserial>=3.5"]

[tool.setuptools]
packages = ["tpu"]
